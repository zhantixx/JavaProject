server:
  port: 8082

spring:
  application:
    name: task-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  datasource:
    url: jdbc:postgresql://postgres-task:5432/task_db
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

user:
  service:
    url: http://user-service:8081

task:
  reminders:
    window-minutes: 60
    cron: "0 */5 * * * *"

logging:
  level:
    org.example.taskservice: DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true
