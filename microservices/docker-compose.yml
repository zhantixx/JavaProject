networks:
  assistant-net:
    driver: bridge

volumes:
  postgres_user_data:
  postgres_task_data:
  postgres_notification_data:
  postgres_analytics_data:
  redis_data:
  grafana_data:

services:
  postgres-user:
    image: postgres:15
    container_name: postgres-user
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_data:/var/lib/postgresql/data
    networks:
      - assistant-net

  postgres-task:
    image: postgres:15
    container_name: postgres-task
    environment:
      POSTGRES_DB: task_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5436:5432"
    volumes:
      - postgres_task_data:/var/lib/postgresql/data
    networks:
      - assistant-net

  postgres-notification:
    image: postgres:15
    container_name: postgres-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5434:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    networks:
      - assistant-net

  postgres-analytics:
    image: postgres:15
    container_name: postgres-analytics
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5435:5432"
    volumes:
      - postgres_analytics_data:/var/lib/postgresql/data
    networks:
      - assistant-net

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6380:6379"          # хост:контейнер (контейнер слушает 6379)
    volumes:
      - redis_data:/data
    networks:
      - assistant-net

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - assistant-net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    ports:
      - "9092:9092"
    networks:
      - assistant-net

  user-service:
    build: ./user-service
    container_name: user-service
    depends_on:
      - postgres-user
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/user_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      TASK_SERVICE_URL: http://task-service:8082
    ports:
      - "8081:8081"
    networks:
      - assistant-net

  task-service:
    build: ./task-service
    container_name: task-service
    depends_on:
      - postgres-task
      - redis
      - user-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-task:5432/task_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USER_SERVICE_URL: http://user-service:8081
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    networks:
      - assistant-net

  ai-service:
    build: ./ai-service
    container_name: ai-service
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_URL: https://api.deepseek.com/v1/chat/completions
      DEEPSEEK_MODEL: deepseek-chat
    ports:
      - "8083:8083"
    networks:
      - assistant-net

  notification-service:
    build: ./notification-service
    container_name: notification-service
    depends_on:
      - kafka
      - postgres-notification
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_SERVICE_PORT: 8084
    ports:
      - "8084:8084"
    networks:
      - assistant-net

  analytics-service:
    build: ./analytics-service
    container_name: analytics-service
    depends_on:
      - postgres-analytics
      - task-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-analytics:5432/analytics_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123456
      TASK_SERVICE_URL: http://task-service:8082
    ports:
      - "8085:8085"
    networks:
      - assistant-net

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - user-service
      - task-service
      - ai-service
      - notification-service
      - analytics-service
      - redis
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - RATE_LIMIT_REQUESTS_PER_MINUTE=100
      - APP_CORS_FILTER_ENABLED=false
      - SPRING_CLOUD_GATEWAY_DEFAULT-FILTERS[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWEDORIGINS=http://localhost:3000
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWEDMETHODS=GET,POST,PUT,DELETE,PATCH,OPTIONS
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWEDHEADERS=*
      - SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS-CONFIGURATIONS_[/**]_ALLOWCREDENTIALS=true
      - SPRING_CLOUD_GATEWAY_ROUTES[0].id=user-service
      - SPRING_CLOUD_GATEWAY_ROUTES[0].uri=http://user-service:8081
      - SPRING_CLOUD_GATEWAY_ROUTES[0].predicates[0]=Path=/api/auth/**,/api/users/**,/api/calendar/**,/oauth2/**,/login/**
      - SPRING_CLOUD_GATEWAY_ROUTES[1].id=task-service
      - SPRING_CLOUD_GATEWAY_ROUTES[1].uri=http://task-service:8082
      - SPRING_CLOUD_GATEWAY_ROUTES[1].predicates[0]=Path=/api/tasks/**,/api/tags/**,/api/calendar/ics
      - SPRING_CLOUD_GATEWAY_ROUTES[2].id=ai-service
      - SPRING_CLOUD_GATEWAY_ROUTES[2].uri=http://ai-service:8083
      - SPRING_CLOUD_GATEWAY_ROUTES[2].predicates[0]=Path=/api/chat/**,/api/ai/**
      - SPRING_CLOUD_GATEWAY_ROUTES[3].id=notification-service
      - SPRING_CLOUD_GATEWAY_ROUTES[3].uri=http://notification-service:8084
      - SPRING_CLOUD_GATEWAY_ROUTES[3].predicates[0]=Path=/api/notifications/**
      - SPRING_CLOUD_GATEWAY_ROUTES[4].id=analytics-service
      - SPRING_CLOUD_GATEWAY_ROUTES[4].uri=http://analytics-service:8085
      - SPRING_CLOUD_GATEWAY_ROUTES[4].predicates[0]=Path=/api/analytics/**
    ports:
      - "8080:8080"
    networks:
      - assistant-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    depends_on:
      - api-gateway
      - user-service
      - task-service
      - ai-service
      - notification-service
      - analytics-service
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - assistant-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - assistant-net
