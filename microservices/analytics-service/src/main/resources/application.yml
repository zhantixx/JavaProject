server:
  port: 8085

spring:
  application:
    name: analytics-service
  datasource:
    url: jdbc:postgresql://localhost:5432/analytics_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
server:
  port: ${ANALYTICS_SERVICE_PORT:8085}

task:
  service:
    url: ${TASK_SERVICE_URL:http://localhost:8082}
logging:
  level:
    org.example.analyticsservice: DEBUG