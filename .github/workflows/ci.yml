name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: mvn test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs:
      - backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: personal-assistant
          path: microservices
          format: HTML
          out: dependency-check-report
          args: >
            --enableRetired

      - name: Upload Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: microservices/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - security
    defaults:
      run:
        working-directory: microservices
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build service images
        run: docker compose build

  performance:
    name: k6 performance smoke
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Validate k6 scenario
        run: k6 inspect performance/k6/task-api-smoke.js

  deploy-dev:
    name: Deploy to development
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    needs:
      - performance
    steps:
      - name: Development deploy placeholder
        run: echo "Development deployment is ready to connect to the target environment."

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs:
      - performance
    environment:
      name: production
    steps:
      - name: Production deploy placeholder
        run: echo "Production deployment requires GitHub Environment approval."
